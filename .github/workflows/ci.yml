name: connector
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: '3.14.2.0'
      - name: Install pinned Clojure CLI (dependency preparation)
        run: |
          mkdir -p "$RUNNER_TEMP/clojure/libexec"
          curl -fLsS https://download.clojure.org/install/clojure-tools-1.12.4.1582.tar.gz -o "$RUNNER_TEMP/clojure.tar.gz"
          tar -xzf "$RUNNER_TEMP/clojure.tar.gz" -C "$RUNNER_TEMP"
          cp "$RUNNER_TEMP"/clojure-tools/*.jar "$RUNNER_TEMP/clojure/libexec/"
          cp "$RUNNER_TEMP/clojure-tools/deps.edn" "$RUNNER_TEMP/clojure-tools/example-deps.edn" "$RUNNER_TEMP/clojure-tools/tools.edn" "$RUNNER_TEMP/clojure/"
          sed "s|PREFIX|$RUNNER_TEMP/clojure|g" "$RUNNER_TEMP/clojure-tools/clojure" > "$RUNNER_TEMP/clojure/clojure"
          chmod +x "$RUNNER_TEMP/clojure/clojure"
          echo "DATOMIC_CONNECTOR_CLOJURE=$RUNNER_TEMP/clojure/clojure" >> "$GITHUB_ENV"
      - name: Prepare acceptance utilities
        run: |
          if ! command -v rg; then
            if [ "$RUNNER_OS" = Linux ]; then
              sudo apt-get update
              sudo apt-get install -y ripgrep
            else
              brew install ripgrep
            fi
          fi
      - name: Prepare clean Maven dependencies
        run: python3 test/clojure-startup.py prepare "$RUNNER_TEMP/clean-clojure"
      - name: Verify prepared Clojure CLI startup
        run: python3 test/clojure-startup.py verify "$RUNNER_TEMP/clean-clojure"
      - name: Prepare Haskell dependencies
        run: |
          mkdir -p .cache
          cabal build --enable-tests all
          (cd starter && cabal build --enable-tests all)
      - name: Select resolved Java-only runtime
        run: |
          CLASSPATH=$(python3 -c 'import os, pathlib; print(os.pathsep.join(p for p in pathlib.Path(os.environ["RUNNER_TEMP"], "clean-clojure/classpath.txt").read_text().strip().split(os.pathsep) if p.endswith(".jar")))')
          echo "DATOMIC_CONNECTOR_CLASSPATH=$CLASSPATH" >> "$GITHUB_ENV"
          printf '%s:%s/bridge/src\n' "$CLASSPATH" "$PWD" > .cache/bridge-classpath
      - name: Check metadata
        run: scripts/check-metadata
      - name: Build, unit tests and live acceptance (prepared dependencies)
        run: scripts/acceptance
      - name: Separate starter adoption and migrations (prepared dependencies)
        working-directory: starter
        run: cabal test --offline starter-integration --test-show-details=direct
      - name: Source distributions and installed resources (prepared dependencies)
        run: python3 test/distribution.py
